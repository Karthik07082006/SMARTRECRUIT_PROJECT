server:
  port: ${API_PORT:4000}
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/smartrecruit}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: ${SMTP_SECURE:false}
smartrecruit:
  jwt-secret: ${JWT_SECRET:smartrecruit-local-secret-change-me}
  client-origin: ${CLIENT_ORIGIN:http://localhost:5173}
  upload-dir: ${UPLOAD_DIR:uploads}
  mail-from: ${SMTP_FROM:}
